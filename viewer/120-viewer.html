<!doctype html>
<!--
  120-viewer.html — the shape of a running program, while it runs.

  Nothing on this page can reach the program it is watching. There is no
  control, no field, no button that sends anything: the only connection
  is an event stream coming the other way.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a running program</title>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>

<header>
  <h1>watching</h1>
  <span id="mapname" class="quiet"></span>
  <span class="spacer"></span>
  <span id="state" class="state waiting">waiting for the program</span>
  <span id="joined" class="joined" hidden></span>
  <span id="lost" class="lost" hidden></span>
  <span class="zoom">
    <button id="zoomout" type="button" title="zoom out  (−)">&minus;</button>
    <span id="zoomlevel">100%</span>
    <button id="zoomin" type="button" title="zoom in  (+)">+</button>
    <button id="zoomfit" type="button" title="frame the whole graph  (f, or double-click)">fit</button>
  </span>
  <button id="save" type="button">save this layout</button>
</header>

<main>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Which way a wire runs, said once at the end of it rather than
           by anything travelling along it. -->
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" class="head"></path>
      </marker>
      <marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" class="head live"></path>
      </marker>
    </defs>
    <g id="grid"></g>
    <g id="wires"></g>
    <g id="stations"></g>
  </svg>
</main>

<footer>
  <span id="tally" class="quiet"></span>
  <span class="spacer"></span>
  <span class="quiet">drag a station to move it &middot; drag the paper to pan
  &middot; scroll or <kbd>+</kbd><kbd>&minus;</kbd> to zoom &middot;
  <kbd>f</kbd> or double-click to fit &middot; nothing you do here reaches
  the program</span>
</footer>

<script src="/viewer.js"></script>
</body>
</html>
