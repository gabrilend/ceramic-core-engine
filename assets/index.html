<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoraMech</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0f1117;
  color: #e8eaf6;
  font-family: monospace;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#canvas-wrap {
  flex: 1;
  position: relative;
}

canvas {
  display: block;
  cursor: crosshair;
}

/* Sidebar inspector */
#sidebar {
  width: 280px;
  background: #181c28;
  border-left: 1px solid #2a2f45;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 10px 12px;
  border-bottom: 1px solid #2a2f45;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

#sidebar-header h2 {
  font-size: 11px;
  color: #9ea3c0;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#map-label {
  font-size: 11px;
  color: #4a9eff;
  cursor: pointer;
  user-select: none;
}
#map-label:hover { color: #e8eaf6; }

#inspector {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

#inspector.hidden { display: none; }

#inspector-title {
  font-size: 12px;
  color: #4a9eff;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2a2f45;
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 10px;
}

.field-row label {
  font-size: 10px;
  color: #6c72a0;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.field-row input, .field-row select {
  background: #0f1117;
  border: 1px solid #2a2f45;
  border-radius: 3px;
  color: #e8eaf6;
  font-family: monospace;
  font-size: 11px;
  padding: 4px 6px;
  width: 100%;
}

.field-row input:focus, .field-row select:focus {
  outline: none;
  border-color: #4a9eff;
}

.section-label {
  font-size: 10px;
  color: #6c72a0;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 10px 0 4px;
  border-bottom: 1px solid #2a2f45;
  padding-bottom: 3px;
}

.port-list { display: flex; flex-direction: column; gap: 4px; }

.port-row {
  display: flex;
  gap: 4px;
  align-items: center;
}

.port-row input, .port-row select {
  flex: 1;
  background: #0f1117;
  border: 1px solid #2a2f45;
  border-radius: 3px;
  color: #e8eaf6;
  font-family: monospace;
  font-size: 10px;
  padding: 3px 5px;
}

.port-del {
  background: none;
  border: none;
  color: #555;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
}
.port-del:hover { color: #e91e63; }

.add-port {
  background: none;
  border: 1px dashed #3a3f55;
  border-radius: 3px;
  color: #6c72a0;
  cursor: pointer;
  font-family: monospace;
  font-size: 10px;
  padding: 3px 6px;
  margin-top: 3px;
}
.add-port:hover { border-color: #4a9eff; color: #4a9eff; }

.branch-port-row { flex-wrap: wrap; }

/* Status bar */
#status-bar {
  position: absolute;
  bottom: 8px;
  left: 12px;
  right: 12px;
  pointer-events: none;
}

.status {
  display: inline-block;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  background: #1e2130cc;
  color: #9ea3c0;
}
.status.error { color: #e91e63; }

/* Toolbar */
#toolbar {
  position: absolute;
  top: 8px;
  left: 12px;
  display: flex;
  gap: 6px;
}

.toolbar-btn {
  background: #181c28;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  color: #9ea3c0;
  cursor: pointer;
  font-family: monospace;
  font-size: 10px;
  padding: 4px 10px;
}
.toolbar-btn:hover { border-color: #4a9eff; color: #4a9eff; }
.toolbar-btn.active { border-color: #4a9eff; color: #4a9eff; background: #1e2130; }

/* Read-only field display */
.field-readonly {
  background: #0f1117;
  border: 1px solid #2a2f45;
  border-radius: 3px;
  color: #6c72a0;
  font-family: monospace;
  font-size: 11px;
  padding: 4px 6px;
}

/* Derived port display — name is editable, type is read-only */
.port-display { display: flex; flex-direction: column; gap: 2px; }
.port-display-row {
  display: flex;
  align-items: center;
  gap: 4px;
}
.port-name-inp {
  flex: 1;
  background: #0f1117;
  border: 1px solid #2a2f45;
  border-radius: 3px;
  color: #e8eaf6;
  font-family: monospace;
  font-size: 11px;
  padding: 3px 5px;
}
.port-name-inp:focus { outline: none; border-color: #4a9eff; }
.port-type {
  font-size: 10px;
  color: #4a9eff;
  font-family: monospace;
  white-space: nowrap;
}
.port-val-inp {
  width: 72px;
  background: #0f1117;
  border: 1px dashed #3a3f55;
  border-radius: 3px;
  color: #9ea3c0;
  font-family: monospace;
  font-size: 10px;
  padding: 3px 5px;
  flex-shrink: 0;
}
.port-val-inp:focus { outline: none; border-color: #4a9eff; border-style: solid; color: #e8eaf6; }
.port-val-inp::placeholder { color: #3a3f55; }
.port-display-empty { font-size: 11px; color: #3a3f55; padding: 2px 6px; }

/* File browser */
.fb-add-dir-btn {
  display: block;
  width: 100%;
  background: none;
  border: 1px dashed #3a3f55;
  border-radius: 3px;
  color: #6c72a0;
  cursor: pointer;
  font-family: monospace;
  font-size: 10px;
  padding: 4px 6px;
  margin-bottom: 8px;
  text-align: left;
}
.fb-add-dir-btn:hover { border-color: #4a9eff; color: #4a9eff; }
.fb-group-hdr {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  padding: 3px 0;
  user-select: none;
}
.fb-group-hdr:hover .fb-header { color: #e8eaf6; }
.fb-group-toggle {
  font-size: 8px;
  color: #6c72a0;
  width: 10px;
  flex-shrink: 0;
}
.fb-header {
  font-size: 10px;
  color: #6c72a0;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.fb-back {
  background: none;
  border: none;
  color: #4a9eff;
  cursor: pointer;
  font-family: monospace;
  font-size: 11px;
  padding: 0;
  margin-bottom: 8px;
  display: block;
}
.fb-back:hover { text-decoration: underline; }
.fb-file-row {
  padding: 5px 6px;
  font-size: 11px;
  color: #9ea3c0;
  cursor: pointer;
  border-radius: 3px;
  font-family: monospace;
}
.fb-file-row:hover { background: #2a2f45; color: #e8eaf6; }
.fb-fn-row {
  padding: 6px 8px;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  margin-bottom: 5px;
  cursor: pointer;
}
.fb-fn-row:hover { border-color: #4a9eff; background: #1e2130; }
.fb-fn-name {
  font-size: 11px;
  color: #4a9eff;
  font-family: monospace;
  margin-bottom: 3px;
}
.fb-fn-ports {
  font-size: 10px;
  color: #6c72a0;
  font-family: monospace;
  padding-left: 8px;
}
.fb-note {
  font-size: 11px;
  color: #6c72a0;
  font-family: monospace;
  padding: 4px 0;
}
.fb-note.error { color: #e91e63; }

/* Right-click context menu */
#context-menu {
  position: fixed;
  background: #181c28;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  padding: 4px 0;
  z-index: 1000;
  min-width: 150px;
  box-shadow: 0 4px 16px #00000066;
  display: none;
}
.ctx-item {
  padding: 7px 14px;
  font-family: monospace;
  font-size: 11px;
  color: #9ea3c0;
  cursor: pointer;
  user-select: none;
}
.ctx-item:hover { background: #2a2f45; color: #e8eaf6; }
.ctx-item.danger:hover { background: #e91e6322; color: #e91e63; }
.ctx-sep { height: 1px; background: #2a2f45; margin: 4px 0; }

/* Editable inspector title */
.inspector-title-inp {
  background: none;
  border: none;
  border-bottom: 1px solid #2a2f45;
  color: #4a9eff;
  font-family: monospace;
  font-size: 12px;
  width: 100%;
  outline: none;
  padding: 0 0 2px;
}
.inspector-title-inp:focus { border-bottom-color: #4a9eff; }
.inspector-id-sub {
  font-size: 9px;
  color: #3a3f55;
  font-family: monospace;
  margin-top: 3px;
}

/* Delete box button in inspector */
.delete-box-btn {
  width: 100%;
  background: none;
  border: 1px solid #e91e6366;
  border-radius: 3px;
  color: #e91e63;
  cursor: pointer;
  font-family: monospace;
  font-size: 10px;
  padding: 4px 8px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.delete-box-btn:hover { background: #e91e6322; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="toolbar">
    <button class="toolbar-btn" onclick="App.load_map()">reload</button>
    <button class="toolbar-btn" onclick="localStorage.clear(); location.reload()">switch map</button>
    <span style="margin:0 2px;color:#2a2f45;">|</span>
    <button class="toolbar-btn" id="tool-erase-wire" onclick="App.set_tool_mode('erase-wire')">✕ wire</button>
    <span style="margin:0 2px;color:#2a2f45;">|</span>
    <button class="toolbar-btn" onclick="App.export_image()">⬇ png</button>
  </div>
  <div id="status-bar">
    <span id="status" class="status">starting…</span>
  </div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>SoraMech</h2>
    <span id="map-label"></span>
  </div>
  <div id="inspector" class="hidden">
    <div id="inspector-title"></div>
    <div id="inspector-fields"></div>
  </div>
</div>

<script src="js/001-canvas.js"></script>
<script src="js/002-boxes.js"></script>
<script src="js/003-api.js"></script>
<script src="js/007-filebrowser.js"></script>
<script src="js/004-inspector.js"></script>
<script src="js/006-wires.js"></script>
<script src="js/005-app.js"></script>
</body>
</html>
